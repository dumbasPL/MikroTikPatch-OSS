name: Build patched RouterOS release

# Builds the patched main package, the signed component packages and the CHR
# images for one RouterOS version.  Called by check-release.yml when a new
# upstream version shows up, or run manually (Actions -> Build patched RouterOS
# release) to build a version without releasing it: manual runs upload the
# result as workflow artifacts.

on:
  workflow_call:
    inputs:
      version:
        description: RouterOS version to patch (e.g. 7.24.4)
        required: true
        type: string
      release:
        description: Create a GitHub release with the artifacts
        required: false
        type: boolean
        default: false
      boot_test:
        description: Boot every built image in QEMU and check the licence
        required: false
        type: boolean
        default: true
      legacy_bios:
        description: Also build the x86 legacy-BIOS image
        required: false
        type: boolean
        default: true
    secrets:
      KEYS_ENV:
        description: Contents of the keys.env generated by mikrotikpatch genkeys
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: RouterOS version to patch (e.g. 7.24.4)
        required: true
        type: string
      release:
        description: Create a GitHub release with the artifacts (otherwise they are uploaded as artifacts)
        required: true
        type: boolean
        default: false
      boot_test:
        description: Boot every built image in QEMU and check the licence
        required: true
        type: boolean
        default: true
      legacy_bios:
        description: Also build the x86 legacy-BIOS image
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    # never build/release the same version twice at once
    concurrency:
      group: routeros-build-${{ inputs.version }}
      cancel-in-progress: false
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # Ubuntu noble's apt cannot resolve gcc-multilib and the aarch64
          # cross gcc in one transaction; install the two sets separately.
          sudo apt-get install -y --no-install-recommends \
            build-essential liblzma-dev gcc-multilib libc6-dev-i386 wget
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Install QEMU and UEFI firmware
        if: ${{ inputs.boot_test }}
        run: |
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-system-arm ovmf qemu-efi-aarch64

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # the module has no dependencies, nothing worth caching
          cache: false

      # The i386 (tools/musl_i386.sh) and aarch64 (tools/musl_aarch64.sh) musl
      # toolchains are built from source on first use; cache them so repeated
      # builds skip that step.
      - name: Cache the musl toolchains
        uses: actions/cache@v4
        with:
          path: |
            .toolchain/cache
            .toolchain/i386-musl
            .toolchain/aarch64-musl
          key: musl-toolchains-${{ runner.os }}-${{ hashFiles('tools/musl_i386.sh', 'tools/musl_aarch64.sh') }}

      # The MikroTik CDN is slow from the runners.  Keep the ISOs (which the
      # pipeline reuses as the source of every package) across runs; a retry
      # after a failed build then resumes instead of downloading them again.
      - name: Restore the downloaded ISOs
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/build/*/mikrotik-*.iso
            ${{ runner.temp }}/build/*/mikrotik-*.iso.sha256
          key: routeros-iso-${{ runner.os }}-${{ inputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            routeros-iso-${{ runner.os }}-${{ inputs.version }}-

      # All builds must use one stable key set: patched devices trust the
      # licence public key baked into the keygen, and the NPK signatures.
      - name: Write keys.env
        env:
          KEYS_ENV: ${{ secrets.KEYS_ENV }}
        run: |
          set -euo pipefail
          if [ -z "${KEYS_ENV:-}" ]; then
            echo "::error::the KEYS_ENV secret is empty; store the output of 'mikrotikpatch genkeys --out keys.env' in a repository secret named KEYS_ENV"
            exit 1
          fi
          umask 077
          printf '%s\n' "$KEYS_ENV" > keys.env

      - name: Build mikrotikpatch
        run: go build ./cmd/mikrotikpatch

      - name: Patch RouterOS
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          LEGACY_BIOS: ${{ inputs.legacy_bios }}
          BOOT_TEST: ${{ inputs.boot_test }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?([a-z]+[0-9]+)?$ ]]; then
            echo "::error::invalid RouterOS version '$VERSION'"
            exit 1
          fi
          args=(patch-v7 --version "$VERSION" --archs all --keys-file keys.env
                --build-dir "$RUNNER_TEMP/build" --publish-dir publish)
          if [ "$LEGACY_BIOS" = "true" ]; then args+=(--legacy-bios); fi
          # hosted runners have no KVM, so the emulated boot test needs headroom
          if [ "$BOOT_TEST" = "true" ]; then args+=(--boot-test --boot-test-timeout 1800); fi
          ./mikrotikpatch "${args[@]}"

      - name: Assemble the release notes
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          {
            echo "Patched RouterOS $VERSION build."
            echo "- Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo ""
            cat "publish/$VERSION/CHANGELOG"
          } > "$RUNNER_TEMP/release-notes.md"

      - name: Upload the build artifacts
        if: ${{ !inputs.release }}
        uses: actions/upload-artifact@v4
        with:
          name: routeros-${{ inputs.version }}
          path: |
            publish/${{ inputs.version }}/CHANGELOG
            publish/${{ inputs.version }}/routeros-*.npk
            publish/${{ inputs.version }}/all_packages-*.zip
            publish/${{ inputs.version }}/chr-*.img.zip
          if-no-files-found: error
          # npk files and image zips are already compressed
          compression-level: 0

      - name: Create the GitHub release
        if: ${{ inputs.release }}
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          dir="publish/$VERSION"
          assets=("$dir"/routeros-*.npk "$dir"/all_packages-*.zip "$dir"/chr-*.img.zip)
          extra=()
          case "$VERSION" in *beta*|*rc*) extra+=(--prerelease) ;; esac
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $tag already exists; uploading the assets"
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
          else
            target=(--target "$GITHUB_SHA")
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
              # a tag without a release: attach the release to it
              target=()
            fi
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "RouterOS $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" \
              "${target[@]}" "${extra[@]}" "${assets[@]}"
          fi

      # Save the ISOs even when the build failed, so the next attempt resumes
      # from them instead of re-downloading from the slow CDN.
      - name: Save the downloaded ISOs
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/build/*/mikrotik-*.iso
            ${{ runner.temp }}/build/*/mikrotik-*.iso.sha256
          key: routeros-iso-${{ runner.os }}-${{ inputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
